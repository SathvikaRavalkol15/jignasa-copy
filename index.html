
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jignasa - Academic Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F0F7FF; /* Very light pastel blue background */
        color: #1F2937;
      }
      h1, h2, h3, h4, h5, h6, .font-serif {
        font-family: 'Merriweather', serif;
      }
      .jignasa-blue {
        color: #60A5FA; /* Pastel blue accent */
      }
      .bg-jignasa-blue {
        background-color: #AEC6CF; /* Soft pastel blue */
      }
      
      /* --- High Elevation & Pop-Out Theme --- */
      .btn-elevated {
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.03);
      }
      .btn-elevated:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      .btn-elevated:active {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.12), 0 15px 15px -5px rgba(0, 0, 0, 0.06);
      }

      .modal-elevated {
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 10px 20px -5px rgba(0, 0, 0, 0.05);
        animation: modalRise 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes modalRise {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .dropdown-elevated {
        box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        animation: dropdownRise 0.2s ease-out forwards;
      }

      @keyframes dropdownRise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      /* Global Input Styling */
      input, select, textarea {
        background-color: #ffffff !important;
      }

      input::placeholder, textarea::placeholder {
        color: #93C5FD !important;
        opacity: 1 !important;
      }
      
      /* --- Global Scrollbar Styling --- */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #F0F7FF;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #AEC6CF; 
        border-radius: 4px;
        border: 2px solid #F0F7FF;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #93C5FD;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "socket.io-client": "https://esm.sh/socket.io-client@4.7.4",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
    "firebase/": "https://esm.sh/firebase@^12.9.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
